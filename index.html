<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Google AI Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Mode Selection Screen -->
  <div id="mode-selector" class="overlay-screen">
    <div class="mode-box">
      <h2>SELECT DEVICE MODE</h2>
      <div class="mode-btns">
        <button onclick="selectMode('mobile')">📱 MOBILE (9:16)</button>
        <button onclick="selectMode('tablet')">📟 TABLET (16:9)</button>
        <button onclick="selectMode('pc')">💻 PC MODE</button>
      </div>
    </div>
  </div>

  <!-- Start Screen with Minutes & Sound -->
  <div id="start-screen" class="overlay-screen hidden">
    <div class="start-box">
      <div class="start-flags-row">🐍 🍎 🏆 🌶️ 🌟</div>
      <h1 class="start-title">GOOGLE AI SNAKE</h1>
      <div class="start-underline"></div>
      
      <!-- ⏱️ সময় সিলেক্টর -->
      <div class="rounds-selector-box">
        <div class="rounds-label">SELECT RUN DURATION:</div>
        <div class="rounds-btn-group">
          <button type="button" class="round-btn" onclick="setSimulationMinutes(1, this)">1 MIN</button>
          <button type="button" class="round-btn" onclick="setSimulationMinutes(3, this)">3 MIN</button>
          <button type="button" class="round-btn active" onclick="setSimulationMinutes(5, this)">5 MIN</button>
          <button type="button" class="round-btn" onclick="setSimulationMinutes(10, this)">10 MIN</button>
          <button type="button" class="round-btn" onclick="setSimulationMinutes(15, this)">15 MIN</button>
        </div>
      </div>

      <!-- 🎵 সাউন্ড ও মিউজিক -->
      <div class="music-settings-box">
        <div class="music-label">🎶 SOUND & MUSIC:</div>
        <select id="bgmSelect" class="bgm-dropdown" onchange="handleBgmSelectChange()">
          <option value="google">🕹️ Google Arcade Pop</option>
          <option value="cyber">⚡ Cyber Glow Beat</option>
          <option value="synth">🎵 Procedural Synth Beat</option>
          <option value="custom">🔗 Custom MP3 Link</option>
        </select>

        <div id="customMusicInputWrapper" class="custom-music-wrapper hidden">
          <input type="text" id="customBgmUrl" class="custom-music-input" placeholder="Paste direct .mp3 link..." />
        </div>

        <div class="volume-slider-row">
          <span class="vol-icon">🔊 VOLUME:</span>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.85" oninput="changeVolume(this.value)" />
          <span id="volumeValueText" class="vol-percent">85%</span>
        </div>
      </div>

      <!-- 🖥️ ফুলস্ক্রিন চেকবক্স -->
      <label class="fullscreen-option">
        <input type="checkbox" id="fullscreenToggle" checked />
        <span>🖥️ Launch in Fullscreen Mode</span>
      </label>

      <button class="start-battle-btn" onclick="beginBattle()">
        <span class="play-icon">▶</span> START AI SNAKE
      </button>

      <div class="start-footer-text">SMART PATTERN AI · CONTINUOUS RUNS</div>
    </div>
  </div>

  <!-- Main Game App -->
  <div id="app" class="hidden">
    <!-- Top Score Bar -->
    <header class="google-top-bar">
      <div class="google-bar-item">
        <span class="bar-icon">🍎</span>
        <span class="bar-val" id="topFoodCount">0</span>
      </div>
      <div class="google-bar-item">
        <span class="bar-icon">🏆</span>
        <span class="bar-val" id="topBestCount">0</span>
      </div>
    </header>

    <!-- Main Game Layout -->
    <div class="game-content-layout">
      <div class="arena-container">
        <canvas id="arena"></canvas>
        
        <!-- Summary Overlay -->
        <div id="winnerOverlay" class="winner-overlay hidden">
          <div class="round-winner-text" id="winnerHeading">TIME UP</div>
          <div class="winner-flag-box">👑</div>
          <div class="podium-card gold">
            <span class="podium-badge">🏆 SESSION HIGH SCORE 🏆</span>
            <div class="podium-name" id="podium1Name">0 Foods</div>
          </div>
          <button class="start-battle-btn" style="margin-top: 14px; padding: 10px 22px; font-size: 13px;" onclick="restartTournament()">
            🔄 PLAY AGAIN
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
