<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Snake Game</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            border: 3px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
            background-color: #1e1e1e;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 }
    ];

    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = -1;
    let score = 0;

    function placeFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                placeFood();
                break;
            }
        }
    }

    // খাবার খুঁজে সরাসরি যাওয়ার জন্য সঠিক AI দিশা নির্ধারণ
    function getNextAIMove() {
        const head = snake[0];
        const possibleMoves = [
            { x: 0, y: -1 }, // Up
            { x: 0, y: 1 },  // Down
            { x: -1, y: 0 }, // Left
            { x: 1, y: 0 }   // Right
        ];

        // দেয়ালে বা নিজের গায়ে ধাক্কা না লাগার মতো বৈধ মুভ বাছাই
        let validMoves = possibleMoves.filter(move => {
            if (move.x === -dx && move.y === -dy) return false;

            let newX = head.x + move.x;
            let newY = head.y + move.y;

            if (newX < 0 || newX >= tileCount || newY < 0 || newY >= tileCount) return false;

            for (let i = 0; i < snake.length - 1; i++) {
                if (snake[i].x === newX && snake[i].y === newY) return false;
            }

            return true;
        });

        if (validMoves.length === 0) {
            validMoves = possibleMoves.filter(move => {
                let newX = head.x + move.x;
                let newY = head.y + move.y;
                return newX >= 0 && newX < tileCount && newY >= 0 && newY < tileCount;
            });
        }

        // খাবারের সবচেয়ে কাছে নিয়ে যাওয়া পথটি বেছে নেওয়া
        if (validMoves.length > 0) {
            validMoves.sort((a, b) => {
                let distA = Math.abs((head.x + a.x) - food.x) + Math.abs((head.y + a.y) - food.y);
                let distB = Math.abs((head.x + b.x) - food.x) + Math.abs((head.y + b.y) - food.y);
                return distA - distB;
            });

            dx = validMoves[0].x;
            dy = validMoves[0].y;
        }
    }

    function gameLoop() {
        getNextAIMove();

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            resetGame();
            return;
        }

        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                resetGame();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function resetGame() {
        snake = [
            { x: 10, y: 10 },
            { x: 10, y: 11 },
            { x: 10, y: 12 }
        ];
        dx = 0;
        dy = -1;
        score = 0;
        placeFood();
    }

    function draw() {
        ctx.fillStyle = "#1e1e1e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // খাবার আঁকা
        ctx.fillStyle = "#FF5722";
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
        ctx.fill();

        // সাপ আঁকা
        snake.forEach((segment, index) => {
            ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784";
            ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
        });

        // স্কোরের লেখা
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "16px sans-serif";
        ctx.fillText("Score: " + score, 10, 25);
    }

    placeFood();
    setInterval(gameLoop, 100);
</script>
</body>
</html>
